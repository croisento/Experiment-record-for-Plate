<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Well Plate Editor</title>
<link rel="manifest" href="manifest.json"/>
<style>
:root{
  --bg:#fff;--bg2:#f5f4f1;--bg3:#eeede9;
  --text:#2C2C2A;--text2:#5F5E5A;--text3:#888780;
  --border:rgba(0,0,0,.13);--border2:rgba(0,0,0,.28);
  --r:8px;--rl:12px;
}
@media(prefers-color-scheme:dark){
  :root{--bg:#1e1e1c;--bg2:#2a2a28;--bg3:#333330;--text:#f0ede8;--text2:#b0ada8;--text3:#666460;--border:rgba(255,255,255,.12);--border2:rgba(255,255,255,.24)}
}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:'Courier New',monospace;font-size:13px;background:var(--bg3);color:var(--text);min-height:100vh;padding:16px}
header{display:flex;align-items:center;justify-content:space-between;margin-bottom:14px}
header h1{font-size:15px;font-weight:500;letter-spacing:.03em;color:var(--text2)}
header p{font-size:11px;color:var(--text3)}
.card{background:var(--bg);border-radius:var(--rl);border:.5px solid var(--border);padding:14px 16px;max-width:900px;margin:0 auto}
.app{display:flex;flex-direction:column;gap:10px}
.tabs-row{display:flex;align-items:center;gap:4px;flex-wrap:wrap}
.tab{display:flex;align-items:center;gap:4px;padding:5px 12px;border:.5px solid var(--border);border-radius:var(--r);background:var(--bg2);color:var(--text2);cursor:pointer;font-size:12px;font-family:inherit;white-space:nowrap;transition:background .1s}
.tab.on{background:var(--bg);color:var(--text);border-color:var(--border2);font-weight:500}
.tab:hover:not(.on){color:var(--text)}
.tx{opacity:.35;font-size:15px;cursor:pointer;padding:0 1px;line-height:1}
.tx:hover{opacity:1}
.tadd{padding:4px 10px;border:.5px dashed var(--border2);border-radius:var(--r);background:transparent;color:var(--text3);cursor:pointer;font-size:17px;font-family:inherit}
.tadd:hover{color:var(--text)}
.btn{font-family:inherit;font-size:12px;padding:5px 11px;border:.5px solid var(--border2);border-radius:var(--r);background:var(--bg);color:var(--text);cursor:pointer;white-space:nowrap;transition:background .1s}
.btn:hover{background:var(--bg2)}
.btn.on{background:var(--text);color:var(--bg)}
.vsep{width:1px;height:26px;background:var(--border);flex-shrink:0}
.toolbar-row{display:flex;align-items:center;gap:6px;flex-wrap:wrap}
/* chips */
.chips{display:flex;gap:5px;flex-wrap:wrap;align-items:center}
.chip{display:flex;align-items:center;gap:5px;padding:4px 8px 4px 6px;border:.5px solid var(--border);border-radius:20px;cursor:pointer;font-size:12px;color:var(--text2);background:var(--bg);white-space:nowrap;transition:border-color .1s,color .1s;user-select:none;}
.chip:hover{border-color:var(--border2);color:var(--text)}
.chip.on{border-color:var(--text);color:var(--text);background:var(--bg2);font-weight:500}
.chip-dot{width:14px;height:14px;border-radius:50%;flex-shrink:0;border:1px solid rgba(0,0,0,.1);cursor:pointer;transition:transform .1s}
.chip-dot:hover{transform:scale(1.25)}
.chip-lbl{line-height:1;cursor:pointer}
.chip-lbl:hover{text-decoration:underline}
.chip-lbl-in{font-family:inherit;font-size:12px;padding:0 3px;width:80px;border:none;border-bottom:1px solid var(--border2);background:transparent;color:var(--text);outline:none}
.chip-del{opacity:0;font-size:14px;line-height:1;cursor:pointer;color:var(--text3);margin-left:1px;transition:opacity .1s}
.chip:hover .chip-del{opacity:.5}
.chip-del:hover{opacity:1!important;color:#d44}
.chip-erase{display:flex;align-items:center;gap:5px;padding:4px 10px;border:.5px dashed var(--border2);border-radius:20px;cursor:pointer;font-size:12px;color:var(--text3);background:var(--bg);white-space:nowrap}
.chip-erase:hover,.chip-erase.on{border-color:var(--text);color:var(--text);font-weight:500}
.chip-add{padding:4px 10px;border:.5px dashed var(--border2);border-radius:20px;cursor:pointer;font-size:12px;color:var(--text3);white-space:nowrap;transition:color .1s,border-color .1s}
.chip-add:hover{color:var(--text);border-color:var(--text)}
.add-form{display:flex;align-items:center;gap:6px;padding:4px 10px;border:.5px solid var(--border2);border-radius:20px;background:var(--bg2)}
.add-form input[type="color"]{width:26px;height:26px;padding:0;border:.5px solid var(--border);border-radius:5px;cursor:pointer;background:none}
.add-form input[type="text"]{font-family:inherit;font-size:12px;padding:2px 6px;border:.5px solid var(--border);border-radius:6px;background:var(--bg);color:var(--text);width:90px;outline:none}
.add-form input[type="text"]:focus{border-color:var(--border2)}
.add-form button{font-family:inherit;font-size:11px;padding:2px 7px;border:.5px solid var(--border2);border-radius:5px;background:var(--bg);color:var(--text);cursor:pointer}
.add-form button:hover{background:var(--text);color:var(--bg)}
/* font size */
.fsz-ctrl{display:flex;align-items:center;gap:4px;font-size:12px;color:var(--text2)}
.fsz-btn{font-family:inherit;font-size:13px;width:22px;height:22px;display:flex;align-items:center;justify-content:center;border:.5px solid var(--border2);border-radius:5px;background:var(--bg);color:var(--text);cursor:pointer;line-height:1;flex-shrink:0;transition:background .1s}
.fsz-btn:hover{background:var(--bg2)}
.fsz-val{min-width:28px;text-align:center;font-size:12px;font-weight:500;color:var(--text)}
/* plate zone */
.pzone{position:relative;display:flex;justify-content:center;align-items:flex-start;padding:16px;background:var(--bg2);border-radius:var(--rl);border:.5px solid var(--border);overflow:auto;min-height:200px;user-select:none}
.pzone-inner{
  position:relative;display:inline-block;
  /* annotation margins: top=title area, sides/bottom=notes area */
  padding:76px 48px 48px 48px;
}
/* title area hint text */
.pzone-inner::before{
  content:"← 标注区域：拖入文本框添加标题、日期、备注 →";
  position:absolute;top:22px;left:50%;transform:translateX(-50%);
  font-size:11px;color:var(--text3);opacity:.45;white-space:nowrap;
  pointer-events:none;font-family:'Courier New',monospace;
}
/* separator line between annotation zone and plate */
.pzone-inner::after{
  content:"";position:absolute;
  top:68px;left:24px;right:24px;height:1px;
  background:var(--border);pointer-events:none;
}
#grid-content{position:relative;z-index:1}
.tb-layer{position:absolute;inset:0;pointer-events:none;z-index:10}
/* wells */
.wg{display:inline-grid}
.rl{font-size:11px;color:var(--text3);display:flex;align-items:center;justify-content:center;width:20px;font-weight:500}
.cl2{font-size:11px;color:var(--text3);text-align:center;font-weight:500}
.well{border-radius:50%;border:1.5px solid var(--border2);cursor:crosshair;display:flex;align-items:center;justify-content:center;transition:transform .07s;position:relative}
.well:hover{transform:scale(1.1);z-index:5}
.well.sel{outline:2.5px dashed var(--text);outline-offset:1px;z-index:4}
.wlbl{font-weight:500;text-align:center;line-height:1.2;pointer-events:none;max-width:92%;overflow:hidden;word-break:break-all}
/* text boxes */
.tb{position:absolute;pointer-events:all;min-width:60px;min-height:24px;border:1.5px solid transparent;border-radius:5px;padding:4px 6px;cursor:default}
.tb:hover{border-color:var(--border)}
.tb.tb-sel{border-color:var(--border2);box-shadow:0 0 0 3px rgba(0,0,0,.05)}
/* toolbar floats ABOVE the box — never shifts text position */
.tb-bar{
  position:absolute;bottom:calc(100% + 5px);left:0;
  display:flex;visibility:hidden;
  align-items:center;gap:4px;flex-wrap:nowrap;
  background:var(--bg);border:.5px solid var(--border2);
  border-radius:var(--r);padding:4px 7px;
  box-shadow:0 2px 10px rgba(0,0,0,.12);
  z-index:30;white-space:nowrap;
}
.tb-sel .tb-bar{visibility:visible}
.tb-handle{cursor:move;font-size:14px;color:var(--text3);line-height:1;flex-shrink:0}
.tb-handle:hover{color:var(--text)}
/* free font-size input */
.sz-input{font-family:inherit;font-size:11px;width:38px;padding:1px 4px;border:.5px solid var(--border);border-radius:3px;background:var(--bg);color:var(--text);text-align:center}
.sz-input:focus{border-color:var(--border2);outline:none}
/* bold button */
.b-btn{font-family:serif;font-size:12px;font-weight:bold;padding:1px 5px;border:.5px solid var(--border);border-radius:3px;background:var(--bg);color:var(--text2);cursor:pointer;flex-shrink:0;line-height:1.4}
.b-btn:hover,.b-btn.on{background:var(--text);color:var(--bg);border-color:var(--text)}
.tb-cp-wrap{position:relative;width:14px;height:14px;border-radius:3px;cursor:pointer;flex-shrink:0;border:1px solid var(--border)}
.tb-cp-wrap:hover{transform:scale(1.2)}
.tb-del{cursor:pointer;font-size:14px;color:var(--text3);line-height:1;margin-left:2px;flex-shrink:0}
.tb-del:hover{color:#e55}
.tb-content{white-space:pre-wrap;word-break:break-word;cursor:text;min-height:20px;min-width:50px;line-height:1.5}
.tb-textarea{font-family:'Courier New',monospace;background:transparent;border:none;outline:none;resize:both;width:160px;min-height:60px;line-height:1.5;display:block}
/* selection bar */
.selbar{display:flex;align-items:center;gap:6px;flex-wrap:wrap;padding:8px 12px;background:var(--bg);border:.5px solid var(--border2);border-radius:var(--r)}
.slbl{font-size:12px;color:var(--text2)}
.msw{width:16px;height:16px;border-radius:50%;cursor:pointer;flex-shrink:0;transition:transform .1s;border:1.5px solid transparent}
.msw:hover{transform:scale(1.2)}
/* legend */
.legend{display:flex;gap:4px 14px;flex-wrap:wrap;padding:8px 12px;background:var(--bg2);border-radius:var(--r);border:.5px solid var(--border);font-size:12px;color:var(--text2);align-items:center}
.ldot{width:12px;height:12px;border-radius:50%;flex-shrink:0}
/* edit panel (编辑区) */
.epanel{background:var(--bg);border:.5px solid var(--border2);border-radius:var(--r);padding:10px 12px;display:flex;flex-direction:column;gap:9px}
.ehead{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.etitle{font-size:12px;font-weight:500;color:var(--text);white-space:nowrap}
.eaxis{display:flex;gap:4px}
.ekeys{display:flex;gap:3px;flex-wrap:wrap}
.ekey{font-family:inherit;font-size:12px;min-width:26px;padding:3px 7px;border:.5px solid var(--border);border-radius:5px;background:var(--bg2);color:var(--text2);cursor:pointer;line-height:1.3}
.ekey:hover{color:var(--text);border-color:var(--border2)}
.ekey.on{background:var(--text);color:var(--bg);border-color:var(--text);font-weight:500}
.ehint{font-size:11px;color:var(--text3);margin-left:auto}
.egrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:7px 12px}
.ecell{display:flex;align-items:center;gap:6px}
.edot{width:10px;height:10px;border-radius:50%;flex-shrink:0;border:1px solid var(--border2)}
.eid{font-size:11px;color:var(--text2);width:36px;flex-shrink:0;font-weight:500}
.ein{flex:1;min-width:0;font-family:inherit;font-size:12px;padding:3px 5px;border:none;border-bottom:1px solid var(--border);background:transparent;color:var(--text);outline:none}
.ein:focus{border-bottom-color:var(--text);background:var(--bg2)}
.ein::placeholder{color:var(--text3);opacity:.45}
.well.eline{box-shadow:0 0 0 2px var(--border2)}
/* modal */
.overlay{position:fixed;inset:0;background:rgba(0,0,0,.35);z-index:100;display:flex;align-items:center;justify-content:center}
.modal{background:var(--bg);border-radius:var(--rl);border:.5px solid var(--border2);padding:20px 22px;min-width:260px;max-width:320px}
.modal h3{font-size:14px;font-weight:500;margin-bottom:13px;color:var(--text)}
.modal input,.modal select{width:100%;font-family:inherit;font-size:13px;padding:7px 10px;border:.5px solid var(--border2);border-radius:var(--r);background:var(--bg2);color:var(--text);margin-bottom:9px}
.mrow{display:flex;gap:8px;justify-content:flex-end;margin-top:8px}
/* free label font-size input */
.lfs-input{font-family:inherit;font-size:12px;width:38px;padding:2px 4px;border:.5px solid var(--border2);border-radius:5px;background:var(--bg);color:var(--text);text-align:center}
.lfs-input:focus{outline:none;border-color:var(--text)}
.hint{font-size:11px;color:var(--text3);padding:0 2px}
.hidden-cp{position:absolute;opacity:0;width:0;height:0;pointer-events:none}
</style>
</head>
<body>
<div class="card">
  <header>
    <h1>Well Plate Editor</h1>
    <p>编辑区直接输入孔位标签 · 双击标签页重命名 · 点色点改颜色 · text模式添加文本框</p>
  </header>
  <div class="app" id="app"></div>
</div>
<script>
const CFG={
  w6:{lbl:'6-well',rows:'AB',cols:3,t:'w',sz:84},
  w12:{lbl:'12-well',rows:'ABC',cols:4,t:'w',sz:68},
  w24:{lbl:'24-well',rows:'ABCD',cols:6,t:'w',sz:52},
  w48:{lbl:'48-well',rows:'ABCDEF',cols:8,t:'w',sz:40},
  w96:{lbl:'96-well',rows:'ABCDEFGH',cols:12,t:'w',sz:30},
  w384:{lbl:'384-well',rows:'ABCDEFGHIJKLMNOP',cols:24,t:'w',sz:18},
  l11:{lbl:'Lane 11',slots:11,t:'l'},
  l15:{lbl:'Lane 15',slots:15,t:'l'},
};
let S={
  plates:[{id:1,name:'Plate 1',type:'w96',wells:{},tbs:[]}],
  nid:2,tbNid:1,aid:1,
  colors:[
    {id:'r',hex:'#F09595',lbl:'sample A'},
    {id:'b',hex:'#85B7EB',lbl:'control'},
    {id:'g',hex:'#97C459',lbl:'treated'},
    {id:'a',hex:'#EF9F27',lbl:'standard'},
    {id:'p',hex:'#AFA9EC',lbl:'blank'},
    {id:'t',hex:'#5DCAA5',lbl:'sample B'},
  ],
  ac:'r',
  mode:'paint',
  labelFontSize:13,
  sel:new Set(),selStart:null,mdown:false,
  modal:null,mdata:{},
  editCid:null,
  addingColor:null,
  tbSel:null,tbEdit:null,
  edit:{axis:'row',row:'A',col:1},
};
let tbDrag=null;
const ap=()=>S.plates.find(p=>p.id===S.aid);
const K=(r,c)=>`${r}_${c}`;
const GC=id=>S.colors.find(c=>c.id===id);
const esc=v=>String(v==null?'':v).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
function TC(hex){
  const r=parseInt(hex.slice(1,3),16),g=parseInt(hex.slice(3,5),16),b=parseInt(hex.slice(5,7),16);
  return((0.299*r+0.587*g+0.114*b)/255)>0.54?'#1a1a18':'#ffffff';
}
function SW2(plate,r,c,upd){const k=K(r,c);plate.wells[k]={...(plate.wells[k]||{col:null,lbl:''}), ...upd};}
function selRange(r1,c1,r2,c2){
  const cfg=CFG[ap().type],rows=cfg.rows?cfg.rows.split(''):['A'];
  const ri1=Math.min(rows.indexOf(r1),rows.indexOf(r2)),ri2=Math.max(rows.indexOf(r1),rows.indexOf(r2));
  const ci1=Math.min(c1,c2),ci2=Math.max(c1,c2);
  const keys=[];
  for(let ri=ri1;ri<=ri2;ri++)for(let ci=ci1;ci<=ci2;ci++)keys.push(K(rows[ri],ci));
  return keys;
}
function paintWell(r,c){const plate=ap(),col=S.ac==='e'?null:GC(S.ac);SW2(plate,r,c,{col});}
window.onWD=(r,c)=>{if(S.mode==='text')return;S.mdown=true;if(S.mode==='paint'){paintWell(r,c);renderGrid();renderLegend();syncEditDots();}else{S.selStart={r,c};S.sel=new Set([K(r,c)]);renderGrid();}};
window.onWE=(r,c)=>{if(!S.mdown||S.mode==='text')return;if(S.mode==='paint'){paintWell(r,c);renderGrid();renderLegend();syncEditDots();}else if(S.selStart){S.sel=new Set(selRange(S.selStart.r,S.selStart.c,r,c));renderGrid();}};
window.onWDbl=(r,c)=>{S.modal='label';S.mdata={r,c,val:(ap().wells[K(r,c)]||{}).lbl||''};render();};
window.onWCtx=(e,r,c)=>{e.preventDefault();SW2(ap(),r,c,{col:null});renderGrid();renderLegend();syncEditDots();};
window.switchPlate=id=>{S.aid=id;S.sel=new Set();S.tbSel=null;S.tbEdit=null;render();};
window.delPlate=id=>{if(S.plates.length<=1)return;S.plates=S.plates.filter(p=>p.id!==id);if(S.aid===id)S.aid=S.plates[0].id;S.sel=new Set();render();};
window.openNew=()=>{S.modal='np';S.mdata={name:'Plate '+S.nid,type:'w96'};render();};
window.openRename=id=>{const p=S.plates.find(x=>x.id===id);S.modal='rp';S.mdata={pid:id,val:p.name};render();};
window.openBL=()=>{S.modal='bl';S.mdata={val:''};render();};
window.closeModal=save=>{
  if(save){const{modal:m,mdata:d}=S;
    if(m==='label')SW2(ap(),d.r,d.c,{lbl:d.val||''});
    else if(m==='np'){const p={id:S.nid++,name:d.name||'Plate '+S.nid,type:d.type,wells:{},tbs:[]};S.plates.push(p);S.aid=p.id;}
    else if(m==='rp'){const p=S.plates.find(x=>x.id===d.pid);if(p)p.name=d.val;}
    else if(m==='bl'){S.sel.forEach(k=>{const pl=ap();pl.wells[k]={...(pl.wells[k]||{col:null,lbl:''}),lbl:d.val||''};});}
  }
  S.modal=null;S.mdata={};render();
};
window.setMode=m=>{S.mode=m;S.sel=new Set();if(m!=='text'){S.tbSel=null;S.tbEdit=null;}render();};
window.setAC=id=>{S.ac=id;renderToolbar();};
window.openColorPicker=id=>{const el=document.getElementById('hcp-'+id);if(el)el.click();};
window.updateColorHex=(id,hex)=>{
  const c=GC(id);if(!c)return;c.hex=hex;
  S.plates.forEach(p=>Object.values(p.wells).forEach(w=>{if(w.col&&w.col.id===id)w.col={...w.col,hex};}));
  renderToolbar();renderGrid();renderLegend();syncEditDots();
};
window.editCLbl=id=>{S.editCid=id;renderToolbar();setTimeout(()=>{const e=document.getElementById('ec-'+id);if(e){e.focus();e.select();}},15);};
window.saveCLbl=(id,val)=>{
  const c=GC(id);if(c&&val.trim())c.lbl=val.trim();
  S.plates.forEach(p=>Object.values(p.wells).forEach(w=>{if(w.col&&w.col.id===id)w.col={...w.col,lbl:val.trim()};}));
  S.editCid=null;renderToolbar();renderLegend();
};
window.deleteColor=id=>{
  S.colors=S.colors.filter(c=>c.id!==id);
  S.plates.forEach(p=>{Object.keys(p.wells).forEach(k=>{if(p.wells[k].col&&p.wells[k].col.id===id)p.wells[k].col=null;});});
  if(S.ac===id)S.ac=S.colors.length?S.colors[0].id:'e';
  if(S.editCid===id)S.editCid=null;
  render();
};
window.openAddColor=()=>{
  const rnd=()=>Math.floor(Math.random()*180+60).toString(16).padStart(2,'0');
  S.addingColor={hex:'#'+rnd()+rnd()+rnd(),name:''};
  S.editCid=null;renderToolbar();
  setTimeout(()=>{const e=document.getElementById('nc-name');if(e)e.focus();},15);
};
window.updateNewHex=hex=>{if(S.addingColor)S.addingColor.hex=hex;};
window.updateNewName=v=>{if(S.addingColor)S.addingColor.name=v;};
window.confirmAddColor=()=>{
  if(!S.addingColor)return;
  const id='c'+Date.now();
  const lbl=S.addingColor.name.trim()||'group '+(S.colors.length+1);
  S.colors.push({id,hex:S.addingColor.hex,lbl});
  S.ac=id;S.addingColor=null;renderToolbar();
};
window.cancelAddColor=()=>{S.addingColor=null;renderToolbar();};
window.setLFS=delta=>{S.labelFontSize=Math.max(8,Math.min(28,S.labelFontSize+delta));renderToolbar();renderGrid();};
window.applySelColor=cid=>{
  const col=cid==='e'?null:GC(cid);
  S.sel.forEach(k=>{const pl=ap();pl.wells[k]={...(pl.wells[k]||{col:null,lbl:''}),col};});
  renderGrid();renderLegend();syncEditDots();
};
window.clearSel=()=>{S.sel=new Set();renderGrid();renderSelBar();};
window.clearAll=()=>{ap().wells={};S.sel=new Set();renderGrid();renderLegend();renderEditPanel();renderSelBar();};
window.selectAll=()=>{
  const plate=ap(),cfg=CFG[plate.type],keys=[];
  if(cfg.t==='w'){const rows=cfg.rows.split('');rows.forEach(r=>{for(let c=1;c<=cfg.cols;c++)keys.push(K(r,c));});}
  else{for(let i=1;i<=cfg.slots;i++)keys.push(K('A',i));}
  S.sel=new Set(keys);renderGrid();renderSelBar();
};
/* ---------- 编辑区 (edit area) ---------- */
function plateDims(){
  const cfg=CFG[ap().type];
  return{cfg,rows:cfg.t==='w'?cfg.rows.split(''):['A'],cols:cfg.t==='w'?cfg.cols:cfg.slots};
}
function normEdit(){
  const{cfg,rows,cols}=plateDims();
  if(cfg.t!=='w')S.edit.axis='row';

function editCells(){
  const{rows,cols}=plateDims();normEdit();
  const out=[];
  if(S.edit.axis==='row'){for(let c=1;c<=cols;c++)out.push({r:S.edit.row,c});}
  else rows.forEach(r=>out.push({r,c:S.edit.col}));
  return out;
}

window.onEditKeyDown=(e,i)=>{
  let t=null;

  else if(e.key==='ArrowUp')t=i-1;
  else return;
  e.preventDefault();
  const el=document.getElementById('ei-'+t);if(el){el.focus();el.select();}
};
// paste a multi-line / tab-separated block: fills this cell and the ones after it
window.onEditPaste=(e,i)=>{
  const txt=((e.clipboardData||window.clipboardData)||{getData:()=>''}).getData('text');
  if(!txt||!/[\t\n\r]/.test(txt))return;
  e.preventDefault();
  const vals=txt.split(/\r\n|\r|\n|\t/).map(v=>v.trim());
  const cells=editCells();
  vals.forEach((v,j)=>{const cell=cells[i+j];if(cell)SW2(ap(),cell.r,cell.c,{lbl:v.slice(0,15)});});
  renderEditPanel();renderGrid();
  const last=Math.min(i+vals.length-1,cells.length-1);
  setTimeout(()=>{const el=document.getElementById('ei-'+last);if(el){el.focus();el.setSelectionRange(el.value.length,el.value.length);}},10);
};

window.exportPNG=()=>{
  const plate=ap(),cfg=CFG[plate.type],nm=plate.name;
  const used=new Map();Object.values(plate.wells).forEach(w=>{if(w.col)used.set(w.col.id,w.col);});
  // Canvas outer padding + annotation margins (mirror CSS .pzone-inner padding)
  const CP=16; // canvas outer padding
  const MT=MARG.top,MS=MARG.side,MB=MARG.bot;
  const LFS=S.labelFontSize;
  let canvas;
  if(cfg.t==='w'){
    const rows=cfg.rows.split(''),cols=cfg.cols;
    const sz=Math.max(18,Math.min(62,Math.floor(560/cols)));
    const gap=Math.max(5,Math.floor(sz*.12)),LW=32,LH=28;
    // total canvas size includes annotation margins
    const W=CP*2+MS*2+LW+cols*(sz+gap)-gap;
    const H=CP*2+MT+MB+LH+rows.length*(sz+gap)-gap+(used.size?50:0);
    // grid starts at (CP+MS+LW, CP+MT+LH) in canvas
    const GX=CP+MS+LW,GY=CP+MT+LH;
    canvas=document.createElement('canvas');canvas.width=W*2;canvas.height=H*2;
    const ctx=canvas.getContext('2d');ctx.scale(2,2);
    ctx.fillStyle='#fff';ctx.fillRect(0,0,W,H);
    // subtle separator line (mirrors ::after pseudo)
    ctx.strokeStyle='#e0deda';ctx.lineWidth=.8;
    ctx.beginPath();ctx.moveTo(CP+16,CP+MT-8);ctx.lineTo(W-CP-16,CP+MT-8);ctx.stroke();
    // col labels
    for(let c=0;c<cols;c++){ctx.fillStyle='#888';ctx.font='11px "Courier New"';ctx.textAlign='center';ctx.textBaseline='middle';ctx.fillText(String(c+1),GX+c*(sz+gap)+sz/2,CP+MT+LH/2);}
    // row labels + wells
    rows.forEach((r,ri)=>{
      const y=GY+ri*(sz+gap)+sz/2;
      ctx.fillStyle='#888';ctx.font='11px "Courier New"';ctx.textAlign='center';ctx.textBaseline='middle';ctx.fillText(r,CP+MS+LW/2,y);
      for(let c=0;c<cols;c++){
        const x=GX+c*(sz+gap)+sz/2,w=plate.wells[K(r,c+1)]||{};
        ctx.beginPath();ctx.arc(x,y,sz/2-1.5,0,Math.PI*2);
        ctx.fillStyle=w.col?w.col.hex:'#fff';ctx.fill();
        ctx.strokeStyle=w.col?w.col.hex:'#ddd';ctx.lineWidth=1.5;ctx.stroke();
        if(w.lbl){
          const fs=Math.min(LFS,Math.floor(sz*0.3));
          ctx.fillStyle=w.col?TC(w.col.hex):'#888';ctx.font=fs+'px "Courier New"';ctx.textAlign='center';ctx.textBaseline='middle';
          const parts=w.lbl.match(new RegExp('.{1,'+Math.max(3,Math.floor(sz/fs*0.8))+'}','g'))||[];
          const lh=fs+2;parts.slice(0,3).forEach((ln,i)=>ctx.fillText(ln,x,y+(i-(Math.min(parts.length,3)-1)/2)*lh));
        }
      }
    });
    // legend
    if(used.size){let lx=CP+MS;const ly=H-MB+18;ctx.font='11px "Courier New"';ctx.textBaseline='middle';used.forEach(col=>{ctx.beginPath();ctx.arc(lx+6,ly,6,0,Math.PI*2);ctx.fillStyle=col.hex;ctx.fill();ctx.fillStyle='#333';ctx.textAlign='left';ctx.fillText(col.lbl,lx+15,ly);lx+=ctx.measureText(col.lbl).width+30;});}
    // text boxes — coordinates relative to pzone-inner (0,0), canvas = CP + tb.x/y
    (plate.tbs||[]).forEach(tb=>{
      const lines=(tb.text||'').split('\n');
      const fw=tb.bold?'bold ':'';
      ctx.fillStyle=tb.color||'#222';ctx.font=fw+tb.size+'px "Courier New"';ctx.textAlign='left';ctx.textBaseline='top';
      lines.forEach((ln,i)=>ctx.fillText(ln,CP+tb.x,CP+tb.y+i*(tb.size*1.4)));
    });
  }else{
    const slots=cfg.slots,SW=46,SH=66,STH=24,gap=5;
    const W=CP*2+MS*2+slots*(SW+gap)-gap;
    const H=CP*2+MT+MB+STH+SH+36+(used.size?50:0);
    const GX=CP+MS,GY=CP+MT;
    canvas=document.createElement('canvas');canvas.width=W*2;canvas.height=H*2;
    const ctx=canvas.getContext('2d');ctx.scale(2,2);
    ctx.fillStyle='#fff';ctx.fillRect(0,0,W,H);
    ctx.strokeStyle='#e0deda';ctx.lineWidth=.8;
    ctx.beginPath();ctx.moveTo(CP+16,CP+MT-8);ctx.lineTo(W-CP-16,CP+MT-8);ctx.stroke();
    for(let i=0;i<slots;i++){
      const x=GX+i*(SW+gap),w=plate.wells[K('A',i+1)]||{};
      const bg=w.col?w.col.hex:'#fff',st=w.col?w.col.hex:'#ddd';
      ctx.fillStyle=bg;ctx.strokeStyle=st;ctx.lineWidth=1.5;
      ctx.beginPath();ctx.rect(x,GY,SW,STH);ctx.fill();ctx.stroke();
      ctx.beginPath();ctx.rect(x,GY+STH,SW,SH);ctx.fill();ctx.stroke();
      ctx.fillStyle='#888';ctx.font='11px "Courier New"';ctx.textAlign='center';ctx.textBaseline='top';ctx.fillText(String(i+1),x+SW/2,GY+STH+SH+6);
      if(w.lbl){ctx.fillStyle=w.col?TC(w.col.hex):'#888';ctx.font=LFS+'px "Courier New"';ctx.textBaseline='middle';ctx.fillText(w.lbl.substring(0,7),x+SW/2,GY+STH+SH/2);}
    }
    ctx.strokeStyle='#ccc';ctx.lineWidth=1.5;ctx.beginPath();ctx.moveTo(GX,GY);ctx.lineTo(GX+slots*(SW+gap)-gap,GY);ctx.stroke();
    if(used.size){let lx=CP+MS;const ly=H-MB+18;ctx.font='11px "Courier New"';ctx.textBaseline='middle';used.forEach(col=>{ctx.beginPath();ctx.arc(lx+6,ly,6,0,Math.PI*2);ctx.fillStyle=col.hex;ctx.fill();ctx.fillStyle='#333';ctx.textAlign='left';ctx.fillText(col.lbl,lx+15,ly);lx+=ctx.measureText(col.lbl).width+30;});}
    (plate.tbs||[]).forEach(tb=>{
      const lines=(tb.text||'').split('\n');
      const fw=tb.bold?'bold ':'';
      ctx.fillStyle=tb.color||'#222';ctx.font=fw+tb.size+'px "Courier New"';ctx.textAlign='left';ctx.textBaseline='top';
      lines.forEach((ln,i)=>ctx.fillText(ln,CP+tb.x,CP+tb.y+i*(tb.size*1.4)));
    });
  }
  const a=document.createElement('a');a.download=nm.replace(/\s+/g,'_')+'.png';a.href=canvas.toDataURL('image/png');a.click();
};

function buildLane(plate,cfg){

  for(let i=1;i<=slots;i++){

    const bg=w.col?w.col.hex:'var(--bg)',st=w.col?w.col.hex:'#aaa8a0',tc=w.col?TC(w.col.hex):'#888',isel=S.sel.has(k);

    h+='<rect x="'+x+'" y="8" width="'+sw+'" height="'+(th+2)+'" fill="'+bg+'" stroke="'+st+'" stroke-width="1.5" rx="2"/>';
    h+='<rect x="'+x+'" y="'+(th+8)+'" width="'+sw+'" height="'+sh+'" fill="'+bg+'" stroke="'+st+'" stroke-width="1.5" rx="2"/>';
    if(isel)h+='<rect x="'+(x-2)+'" y="6" width="'+(sw+4)+'" height="'+(th+sh+4)+'" fill="none" stroke="var(--text)" stroke-width="2" stroke-dasharray="4,3" rx="3"/>';
    h+='<text x="'+(x+sw/2)+'" y="'+(th+sh+28)+'" text-anchor="middle" font-size="11" font-family="monospace" fill="var(--text3)">'+i+'</text>';
    if(w.lbl)h+='<text x="'+(x+sw/2)+'" y="'+(th+sh/2+14)+'" text-anchor="middle" font-size="'+Math.min(LFS,sw*0.7)+'" font-family="monospace" fill="'+tc+'">'+esc(w.lbl.substring(0,7))+'</text>';
    h+='</g>';
  }
  return h+'<line x1="24" y1="8" x2="'+(W-24)+'" y2="8" stroke="#aaa8a0" stroke-width="1.5"/></svg>';
}
function buildSelBar(){
  if(S.mode!=='select'||!S.sel.size)return'';
  let h='<div class="selbar"><span class="slbl">'+S.sel.size+' well'+(S.sel.size>1?'s':'')+' selected</span><div class="vsep"></div><span class="slbl">fill:</span>';
  h+='<div class="msw" style="background:var(--bg);border:1.5px dashed var(--border2);" onclick="applySelColor(\'e\')" title="erase"></div>';
  S.colors.forEach(c=>h+='<div class="msw" style="background:'+c.hex+'" onclick="applySelColor(\''+c.id+'\')" title="'+c.lbl+'"></div>');
  h+='<div class="vsep"></div><button class="btn" onclick="openBL()">label all</button><button class="btn" onclick="selectAll()">select all</button><button class="btn" onclick="clearSel()">deselect</button></div>';
  return h;
}
function buildLegend(){
  const plate=ap(),used=new Map();Object.values(plate.wells).forEach(w=>{if(w.col)used.set(w.col.id,w.col);});
  if(!used.size)return'';
  let h='<div class="legend"><span style="font-size:11px;color:var(--text3);font-weight:500;">legend</span>';
  used.forEach(c=>h+='<div style="display:flex;align-items:center;gap:5px;"><div class="ldot" style="background:'+c.hex+'"></div><span>'+c.lbl+'</span></div>');
  return h+'</div>';
}
function buildModal(){
  if(!S.modal)return'';
  const{modal:m,mdata:d}=S;let inner='';
  if(m==='label')inner='<h3>label '+d.r+d.c+'</h3><input id="mi" type="text" value="'+(d.val||'').replace(/"/g,'&quot;')+'" maxlength="15" placeholder="e.g. ctrl, 100nM" oninput="S.mdata.val=this.value" onkeydown="if(event.key===\'Enter\')closeModal(true);if(event.key===\'Escape\')closeModal(false)"/>';
  else if(m==='np')inner='<h3>new plate</h3><input id="mi" type="text" value="'+d.name+'" placeholder="plate name" oninput="S.mdata.name=this.value" onkeydown="if(event.key===\'Enter\')closeModal(true);if(event.key===\'Escape\')closeModal(false)"/><select onchange="S.mdata.type=this.value">'+Object.entries(CFG).map(([k,v])=>'<option value="'+k+'"'+(d.type===k?' selected':'')+'>'+v.lbl+'</option>').join('')+'</select>';
  else if(m==='rp')inner='<h3>rename plate</h3><input id="mi" type="text" value="'+d.val.replace(/"/g,'&quot;')+'" oninput="S.mdata.val=this.value" onkeydown="if(event.key===\'Enter\')closeModal(true);if(event.key===\'Escape\')closeModal(false)"/>';
  else if(m==='bl')inner='<h3>label '+S.sel.size+' wells</h3><input id="mi" type="text" value="'+(d.val||'').replace(/"/g,'&quot;')+'" maxlength="15" placeholder="e.g. 100nM" oninput="S.mdata.val=this.value" onkeydown="if(event.key===\'Enter\')closeModal(true);if(event.key===\'Escape\')closeModal(false)"/><p style="font-size:11px;color:var(--text3);margin-top:-4px;">同一标签应用到所有选中孔</p>';
  return'<div class="overlay" onclick="closeModal(false)"><div class="modal" onclick="event.stopPropagation()">'+inner+'<div class="mrow"><button class="btn" onclick="closeModal(false)">cancel</button><button class="btn on" onclick="closeModal(true)">save</button></div></div></div>';
}
function renderGrid(){const gc=document.getElementById('grid-content');if(!gc)return;const plate=ap(),cfg=CFG[plate.type];gc.innerHTML=cfg.t==='w'?buildWellGrid(plate,cfg):buildLane(plate,cfg);}
function renderToolbar(){
  const wrap=document.getElementById('toolbar-wrap');if(!wrap)return;
  const tmp=document.createElement('div');tmp.innerHTML=buildToolbar();wrap.replaceWith(tmp.firstChild);
  if(S.editCid)setTimeout(()=>{const e=document.getElementById('ec-'+S.editCid);if(e){e.focus();e.select();}},10);
  if(S.addingColor)setTimeout(()=>{const e=document.getElementById('nc-name');if(e)e.focus();},10);
}
function renderSelBar(){const wrap=document.getElementById('selbar-wrap');if(!wrap)return;wrap.innerHTML=buildSelBar();}
function renderLegend(){const wrap=document.getElementById('legend-wrap');if(!wrap)return;wrap.innerHTML=buildLegend();}
function renderTBLayer(){
  const layer=document.getElementById('tb-layer');if(!layer)return;
  const plate=ap();let h='';
  (plate.tbs||[]).forEach(tb=>{
    const isSel=S.tbSel===tb.id,isEdit=S.tbEdit===tb.id;
    const fw=tb.bold?'bold':'normal';
    const textHtml=(tb.text||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/\n/g,'<br>');
    h+='<div class="tb'+(isSel?' tb-sel':'')+'" id="tb-'+tb.id+'" style="left:'+tb.x+'px;top:'+tb.y+'px;" onclick="tbSelect(event,'+tb.id+')" onmousedown="event.stopPropagation()">';
    // toolbar floats above — does NOT affect text position
    h+='<div class="tb-bar">';
    h+='<span class="tb-handle" onmousedown="tbDown(event,'+tb.id+')" title="drag to move">⠿</span>';
    // free font size input
    h+='<input class="sz-input" type="number" min="8" max="96" value="'+tb.size+'"'
      +' onchange="tbSetSize('+tb.id+',this.value)"'
      +' oninput="tbSizeInput('+tb.id+',this.value)"'
      +' onclick="event.stopPropagation()" title="font size">';
    h+='<span style="font-size:10px;color:var(--text3)">px</span>';
    // bold toggle
    h+='<button class="b-btn'+(tb.bold?' on':'')+'" onclick="tbToggleBold('+tb.id+')" title="bold">B</button>';
    // color picker
    h+='<div class="tb-cp-wrap" id="tbdot-'+tb.id+'" style="background:'+(tb.color||'#2C2C2A')+'" onclick="tbOpenCp('+tb.id+')" title="text color">'
      +'<input type="color" id="tbc-inp-'+tb.id+'" class="hidden-cp" value="'+(tb.color||'#2C2C2A')+'" oninput="tbSetColor('+tb.id+',this.value)"></div>';
    h+='<span class="tb-del" onclick="tbDelete(event,'+tb.id+')">×</span>';
    h+='</div>';
    // text content — position unaffected by toolbar visibility
    if(isEdit){
      h+='<textarea class="tb-textarea" id="tbt-'+tb.id
        +'" style="font-size:'+tb.size+'px;font-weight:'+fw+';color:'+(tb.color||'#2C2C2A')+'"'
        +' onblur="tbBlur('+tb.id+')"'
        +' onkeydown="if(event.key===\'Escape\')tbBlur('+tb.id+');event.stopPropagation();"'
        +' onmousedown="event.stopPropagation()">'+( tb.text||'')+'</textarea>';
    }else{
      h+='<div class="tb-content" id="tbtext-'+tb.id
        +'" style="font-size:'+tb.size+'px;font-weight:'+fw+';color:'+(tb.color||'#2C2C2A')+'"'
        +' ondblclick="tbStartEdit('+tb.id+')">'+(textHtml||'<span style="opacity:.3;font-size:12px">双击编辑</span>')+'</div>';
    }
    h+='</div>';
  });
  layer.innerHTML=h;
  if(S.tbEdit!==null)setTimeout(()=>{const ta=document.getElementById('tbt-'+S.tbEdit);if(ta){ta.focus();ta.setSelectionRange(ta.value.length,ta.value.length);}},15);
}
function render(){
  const plate=ap(),cfg=CFG[plate.type];
  const hints={paint:'click/drag = 涂色  ·  right-click = 擦除  ·  标注文字请用下方编辑区（双击孔位仍可用）',select:'拖拽框选区域  ·  选中后批量填色或标注',text:'点击"+ add text"放置文本框  ·  ⠿ 拖动  ·  double-click 编辑'};
  let h=buildTabs()+buildToolbar();
  h+='<div class="pzone" id="pzone"><div class="pzone-inner"><div id="grid-content">'+(cfg.t==='w'?buildWellGrid(plate,cfg):buildLane(plate,cfg))+'</div><div class="tb-layer" id="tb-layer"></div></div></div>';
  h+='<div id="epanel-wrap">'+buildEditPanel()+'</div>';
  h+='<div id="selbar-wrap">'+buildSelBar()+'</div>';
  h+='<div id="legend-wrap">'+buildLegend()+'</div>';
  h+='<div class="hint">'+(hints[S.mode]||'')+'</div>';
  h+=buildModal();
  document.getElementById('app').innerHTML=h;
  renderTBLayer();
  if(S.modal)setTimeout(()=>{const i=document.getElementById('mi');if(i)i.focus();},20);
}
render();
</script>
</body>
</html>
