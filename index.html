<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Well Plate Editor</title>
<link rel="manifest" href="manifest.json"/>
<meta name="theme-color" content="#ffffff"/>
<style>
  :root {
    --bg: #ffffff;
    --bg2: #f5f4f1;
    --bg3: #eeede9;
    --text: #2C2C2A;
    --text2: #5F5E5A;
    --text3: #888780;
    --border: rgba(0,0,0,0.15);
    --border2: rgba(0,0,0,0.28);
    --radius: 8px;
    --radius-lg: 12px;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #1e1e1c;
      --bg2: #2a2a28;
      --bg3: #333330;
      --text: #f0ede8;
      --text2: #b0ada8;
      --text3: #888780;
      --border: rgba(255,255,255,0.13);
      --border2: rgba(255,255,255,0.25);
    }
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: 'Courier New', monospace;
    font-size: 13px;
    background: var(--bg3);
    color: var(--text);
    min-height: 100vh;
    padding: 16px;
  }
  header {
    display: flex;
    align-items: center;
    justify-content: space-between;
    margin-bottom: 14px;
  }
  header h1 {
    font-size: 15px;
    font-weight: 500;
    letter-spacing: 0.04em;
    color: var(--text2);
  }
  header span { font-size: 11px; color: var(--text3); }
  .card {
    background: var(--bg);
    border-radius: var(--radius-lg);
    border: 0.5px solid var(--border);
    padding: 14px;
    max-width: 760px;
    margin: 0 auto;
  }
  .app { display: flex; flex-direction: column; gap: 10px; }
  .tabs-row { display: flex; align-items: center; gap: 4px; flex-wrap: wrap; }
  .tab {
    display: flex; align-items: center; gap: 4px;
    padding: 4px 10px;
    border: 0.5px solid var(--border);
    border-radius: var(--radius);
    background: var(--bg2);
    color: var(--text2);
    cursor: pointer;
    font-size: 11px; font-family: inherit;
    white-space: nowrap;
    transition: background 0.1s;
  }
  .tab.on { background: var(--bg); color: var(--text); border-color: var(--border2); }
  .tab:hover:not(.on) { color: var(--text); }
  .tx { opacity: 0.4; font-size: 14px; line-height: 1; padding: 0 1px; cursor: pointer; }
  .tx:hover { opacity: 1; }
  .tadd {
    padding: 4px 9px;
    border: 0.5px dashed var(--border2);
    border-radius: var(--radius);
    background: transparent;
    color: var(--text2);
    cursor: pointer;
    font-size: 16px; font-family: inherit;
  }
  .tadd:hover { color: var(--text); }
  .toolbar { display: flex; align-items: flex-start; gap: 6px; flex-wrap: wrap; }
  .btn {
    font-family: inherit; font-size: 11px;
    padding: 4px 9px;
    border: 0.5px solid var(--border2);
    border-radius: var(--radius);
    background: var(--bg);
    color: var(--text);
    cursor: pointer; white-space: nowrap;
  }
  .btn:hover { background: var(--bg2); }
  .btn.on { background: var(--text); color: var(--bg); }
  .vsep { width: 1px; height: 22px; background: var(--border); flex-shrink: 0; margin-top: 2px; }
  .palette { display: flex; gap: 6px; flex-wrap: wrap; align-items: flex-start; }
  .ci { display: flex; flex-direction: column; align-items: center; gap: 2px; }
  .sw {
    width: 20px; height: 20px; border-radius: 50%;
    border: 2px solid transparent; cursor: pointer; flex-shrink: 0;
    transition: transform 0.1s;
  }
  .sw:hover { transform: scale(1.2); }
  .sw.on { border-color: var(--text) !important; }
  .clbl {
    font-size: 8px; color: var(--text3);
    max-width: 36px; overflow: hidden; text-overflow: ellipsis;
    white-space: nowrap; text-align: center; cursor: pointer;
  }
  .clbl:hover { color: var(--text); text-decoration: underline; }
  .clbl-in {
    font-size: 8px; width: 40px;
    border: 0.5px solid var(--border2); padding: 1px 3px;
    font-family: inherit; background: var(--bg2); color: var(--text);
    border-radius: 2px;
  }
  .pzone {
    display: flex; justify-content: center; align-items: center;
    padding: 12px; background: var(--bg2);
    border-radius: var(--radius-lg);
    border: 0.5px solid var(--border);
    overflow: auto; min-height: 180px; user-select: none;
  }
  .wg { display: inline-grid; }
  .rl { font-size: 10px; color: var(--text3); display: flex; align-items: center; justify-content: center; width: 16px; }
  .cl2 { font-size: 10px; color: var(--text3); text-align: center; }
  .well {
    border-radius: 50%; border: 1.5px solid var(--border2);
    cursor: crosshair; display: flex; align-items: center; justify-content: center;
    transition: transform 0.07s;
  }
  .well:hover { transform: scale(1.1); z-index: 5; }
  .well.sel { outline: 2px dashed var(--text); outline-offset: 1px; z-index: 4; }
  .wlbl { font-weight: 500; text-align: center; line-height: 1.1; pointer-events: none; max-width: 90%; overflow: hidden; word-break: break-all; }
  .selbar {
    display: flex; align-items: center; gap: 6px; flex-wrap: wrap;
    padding: 7px 10px; background: var(--bg);
    border: 0.5px solid var(--border2); border-radius: var(--radius);
  }
  .slbl { font-size: 11px; color: var(--text2); }
  .msw { width: 16px; height: 16px; border-radius: 50%; border: 1.5px solid transparent; cursor: pointer; flex-shrink: 0; }
  .msw:hover { transform: scale(1.2); }
  .legend {
    display: flex; gap: 8px; flex-wrap: wrap;
    padding: 8px 10px; background: var(--bg2);
    border-radius: var(--radius); border: 0.5px solid var(--border);
    font-size: 11px; color: var(--text2); align-items: center;
  }
  .ldot { width: 10px; height: 10px; border-radius: 50%; flex-shrink: 0; }
  .overlay {
    position: fixed; inset: 0;
    background: rgba(0,0,0,0.35); z-index: 50;
    display: flex; align-items: center; justify-content: center;
  }
  .modal {
    background: var(--bg); border-radius: var(--radius-lg);
    border: 0.5px solid var(--border2);
    padding: 18px 20px; min-width: 240px; max-width: 300px;
  }
  .modal h3 { font-size: 13px; font-weight: 500; margin-bottom: 12px; color: var(--text); }
  .modal input, .modal select {
    width: 100%; font-family: inherit; font-size: 12px;
    padding: 6px 8px; border: 0.5px solid var(--border2);
    border-radius: var(--radius);
    background: var(--bg2); color: var(--text); margin-bottom: 8px;
  }
  .mrow { display: flex; gap: 8px; justify-content: flex-end; margin-top: 6px; }
  .htxt { font-size: 10px; color: var(--text3); margin-bottom: 4px; }
  .hint { font-size: 10px; color: var(--text3); padding: 0 2px; }
</style>
</head>
<body>
<div class="card">
  <header>
    <h1>Well Plate Editor</h1>
    <span>double-click tab = rename · click color label = rename color</span>
  </header>
  <div class="app" id="app"></div>
</div>

<script>
const CFG={
  w6: {lbl:'6-well',  rows:'AB',       cols:3,  t:'w', sz:80},
  w12:{lbl:'12-well', rows:'ABC',      cols:4,  t:'w', sz:62},
  w24:{lbl:'24-well', rows:'ABCD',     cols:6,  t:'w', sz:48},
  w48:{lbl:'48-well', rows:'ABCDEF',   cols:8,  t:'w', sz:38},
  w96:{lbl:'96-well', rows:'ABCDEFGH', cols:12, t:'w', sz:28},
  l11:{lbl:'Lane 11', slots:11, t:'l'},
  l15:{lbl:'Lane 15', slots:15, t:'l'},
};
let S={
  plates:[{id:1,name:'Plate 1',type:'w96',wells:{}}],
  nid:2, aid:1,
  colors:[
    {id:'e',hex:null,      lbl:'erase'},
    {id:'r',hex:'#F09595', lbl:'sample A'},
    {id:'b',hex:'#85B7EB', lbl:'control'},
    {id:'g',hex:'#97C459', lbl:'treated'},
    {id:'a',hex:'#EF9F27', lbl:'standard'},
    {id:'p',hex:'#AFA9EC', lbl:'blank'},
    {id:'t',hex:'#5DCAA5', lbl:'sample B'},
    {id:'k',hex:'#ED93B1', lbl:'positive'},
    {id:'o',hex:'#F0997B', lbl:'negative'},
    {id:'z',hex:'#B4B2A9', lbl:'unused'},
  ],
  ac:'r', mode:'paint',
  sel:new Set(), selStart:null, mdown:false,
  modal:null, mdata:{}, editCid:null,
};
const ap=()=>S.plates.find(p=>p.id===S.aid);
const K=(r,c)=>`${r}_${c}`;
const GC=id=>S.colors.find(c=>c.id===id);
function TC(hex){
  if(!hex)return'var(--text2)';
  const r=parseInt(hex.slice(1,3),16),g=parseInt(hex.slice(3,5),16),b=parseInt(hex.slice(5,7),16);
  return((0.299*r+0.587*g+0.114*b)/255)>0.54?'#2C2C2A':'#F1EFE8';
}
function SW(plate,r,c,upd){const k=K(r,c);plate.wells[k]={...(plate.wells[k]||{col:null,lbl:''}), ...upd};}
function selRange(r1,c1,r2,c2){
  const plate=ap(),cfg=CFG[plate.type];
  const rows=cfg.rows?cfg.rows.split(''):['A'];
  const ri1=Math.min(rows.indexOf(r1),rows.indexOf(r2));
  const ri2=Math.max(rows.indexOf(r1),rows.indexOf(r2));
  const ci1=Math.min(c1,c2),ci2=Math.max(c1,c2);
  const keys=[];
  for(let ri=ri1;ri<=ri2;ri++)
    for(let ci=ci1;ci<=ci2;ci++) keys.push(K(rows[ri],ci));
  return keys;
}
function paintWell(r,c){const plate=ap(),col=S.ac==='e'?null:GC(S.ac);SW(plate,r,c,{col});}
window.onWD=(r,c)=>{S.mdown=true;if(S.mode==='paint'){paintWell(r,c);}else{S.selStart={r,c};S.sel=new Set([K(r,c)]);}render();};
window.onWE=(r,c)=>{if(!S.mdown)return;if(S.mode==='paint'){paintWell(r,c);}else if(S.selStart){S.sel=new Set(selRange(S.selStart.r,S.selStart.c,r,c));}render();};
window.onWDbl=(r,c)=>{S.modal='label';S.mdata={r,c,val:(ap().wells[K(r,c)]||{}).lbl||''};render();};
window.onWCtx=(e,r,c)=>{e.preventDefault();SW(ap(),r,c,{col:null});render();};
window.switchPlate=id=>{S.aid=id;S.sel=new Set();render();};
window.delPlate=id=>{
  if(S.plates.length<=1)return;
  S.plates=S.plates.filter(p=>p.id!==id);
  if(S.aid===id)S.aid=S.plates[0].id;
  S.sel=new Set();render();
};
window.openNew=()=>{S.modal='np';S.mdata={name:'Plate '+S.nid,type:'w96'};render();};
window.openRename=id=>{const p=S.plates.find(x=>x.id===id);S.modal='rp';S.mdata={pid:id,val:p.name};render();};
window.openBL=()=>{S.modal='bl';S.mdata={val:''};render();};
window.closeModal=save=>{
  if(save){
    const{modal:m,mdata:d}=S;
    if(m==='label')SW(ap(),d.r,d.c,{lbl:d.val});
    else if(m==='np'){const p={id:S.nid++,name:d.name||'Plate '+S.nid,type:d.type,wells:{}};S.plates.push(p);S.aid=p.id;}
    else if(m==='rp'){const p=S.plates.find(x=>x.id===d.pid);if(p)p.name=d.val;}
    else if(m==='bl'){S.sel.forEach(k=>{const pl=ap();pl.wells[k]={...(pl.wells[k]||{col:null,lbl:''}),lbl:d.val};});}
  }
  S.modal=null;S.mdata={};render();
};
window.setMode=m=>{S.mode=m;S.sel=new Set();render();};
window.setAC=id=>{S.ac=id;render();};
window.editCLbl=id=>{S.editCid=id;render();};
window.saveCLbl=(id,val)=>{
  const c=GC(id);if(c&&val.trim())c.lbl=val.trim();
  S.plates.forEach(p=>Object.values(p.wells).forEach(w=>{if(w.col&&w.col.id===id)w.col={...w.col,lbl:val.trim()};}));
  S.editCid=null;render();
};
window.applySelColor=cid=>{
  const col=cid==='e'?null:GC(cid);
  S.sel.forEach(k=>{const pl=ap();pl.wells[k]={...(pl.wells[k]||{col:null,lbl:''}),col};});render();
};
window.clearSel=()=>{S.sel=new Set();render();};
window.clearAll=()=>{ap().wells={};S.sel=new Set();render();};
window.selectAll=()=>{
  const plate=ap(),cfg=CFG[plate.type];
  if(cfg.t==='w'){const rows=cfg.rows.split('');const keys=[];rows.forEach(r=>{for(let c=1;c<=cfg.cols;c++)keys.push(K(r,c));});S.sel=new Set(keys);}
  else{const keys=[];for(let i=1;i<=cfg.slots;i++)keys.push(K('A',i));S.sel=new Set(keys);}
  render();
};
window.exportPNG=()=>{
  const plate=ap(),cfg=CFG[plate.type],nm=plate.name;
  const used=new Map();Object.values(plate.wells).forEach(w=>{if(w.col)used.set(w.col.id,w.col);});
  const pad=28,bh=used.size?44:0;let canvas;
  if(cfg.t==='w'){
    const rows=cfg.rows.split(''),cols=cfg.cols;
    const sz=Math.max(40,Math.min(58,Math.floor(520/cols)));
    const gap=Math.max(4,Math.floor(sz*0.13)),lw=28,lh=26;
    const W=pad*2+lw+cols*(sz+gap)-gap;
    const H=pad+22+lh+rows.length*(sz+gap)-gap+bh+pad;
    canvas=document.createElement('canvas');canvas.width=W*2;canvas.height=H*2;
    const ctx=canvas.getContext('2d');ctx.scale(2,2);
    ctx.fillStyle='#ffffff';ctx.fillRect(0,0,W,H);
    ctx.fillStyle='#2C2C2A';ctx.font='500 12px "Courier New"';ctx.textAlign='left';ctx.textBaseline='middle';ctx.fillText(nm,pad,14);
    const oy=pad+22;
    for(let c=0;c<cols;c++){const x=pad+lw+c*(sz+gap)+sz/2;ctx.fillStyle='#888780';ctx.font='10px "Courier New"';ctx.textAlign='center';ctx.textBaseline='middle';ctx.fillText(String(c+1),x,oy+lh/2);}
    rows.forEach((r,ri)=>{
      const y=oy+lh+ri*(sz+gap)+sz/2;
      ctx.fillStyle='#888780';ctx.font='10px "Courier New"';ctx.textAlign='center';ctx.textBaseline='middle';ctx.fillText(r,pad+lw/2,y);
      for(let c=0;c<cols;c++){
        const x=pad+lw+c*(sz+gap)+sz/2;const w=plate.wells[K(r,c+1)]||{};
        ctx.beginPath();ctx.arc(x,y,sz/2-1,0,Math.PI*2);
        ctx.fillStyle=w.col?w.col.hex:'#f5f5f3';ctx.fill();
        ctx.strokeStyle=w.col?w.col.hex:'#ccc9c5';ctx.lineWidth=1.5;ctx.stroke();
        if(w.lbl){ctx.fillStyle=w.col?TC(w.col.hex):'#888780';ctx.font=`${Math.max(8,sz/5.5)}px "Courier New"`;ctx.textAlign='center';ctx.textBaseline='middle';const parts=w.lbl.match(/.{1,6}/g)||[];parts.slice(0,2).forEach((ln,i)=>ctx.fillText(ln,x,y+(i-(Math.min(parts.length,2)-1)/2)*9));}
      }
    });
    if(used.size){let lx=pad;const ly=H-bh+12;ctx.font='10px "Courier New"';ctx.textBaseline='middle';used.forEach(col=>{ctx.beginPath();ctx.arc(lx+6,ly,6,0,Math.PI*2);ctx.fillStyle=col.hex;ctx.fill();ctx.fillStyle='#444441';ctx.textAlign='left';ctx.fillText(col.lbl,lx+15,ly);lx+=ctx.measureText(col.lbl).width+28;});}
  }else{
    const slots=cfg.slots,sw2=42,sh=62,th=22,gap=5;
    const W=pad*2+slots*(sw2+gap)-gap;const H=pad+22+th+sh+30+bh+pad;
    canvas=document.createElement('canvas');canvas.width=W*2;canvas.height=H*2;
    const ctx=canvas.getContext('2d');ctx.scale(2,2);
    ctx.fillStyle='#ffffff';ctx.fillRect(0,0,W,H);
    ctx.fillStyle='#2C2C2A';ctx.font='500 12px "Courier New"';ctx.textAlign='left';ctx.textBaseline='middle';ctx.fillText(nm,pad,14);
    const oy=pad+22;
    for(let i=0;i<slots;i++){
      const x=pad+i*(sw2+gap);const w=plate.wells[K('A',i+1)]||{};
      const bg=w.col?w.col.hex:'#f5f5f3',st=w.col?w.col.hex:'#ccc9c5';
      ctx.fillStyle=bg;ctx.strokeStyle=st;ctx.lineWidth=1.5;
      ctx.beginPath();ctx.rect(x,oy,sw2,th);ctx.fill();ctx.stroke();
      ctx.beginPath();ctx.rect(x,oy+th,sw2,sh);ctx.fill();ctx.stroke();
      ctx.fillStyle='#888780';ctx.font='9px "Courier New"';ctx.textAlign='center';ctx.textBaseline='top';ctx.fillText(String(i+1),x+sw2/2,oy+th+sh+4);
      if(w.lbl){ctx.fillStyle=w.col?TC(w.col.hex):'#888780';ctx.font='9px "Courier New"';ctx.textBaseline='middle';ctx.fillText(w.lbl.substring(0,6),x+sw2/2,oy+th+sh/2);}
    }
    ctx.strokeStyle='#999';ctx.lineWidth=1.5;ctx.beginPath();ctx.moveTo(pad,oy);ctx.lineTo(pad+slots*(sw2+gap)-gap,oy);ctx.stroke();
    if(used.size){let lx=pad;const ly=H-bh+12;ctx.font='10px "Courier New"';ctx.textBaseline='middle';used.forEach(col=>{ctx.beginPath();ctx.arc(lx+6,ly,6,0,Math.PI*2);ctx.fillStyle=col.hex;ctx.fill();ctx.fillStyle='#444441';ctx.textAlign='left';ctx.fillText(col.lbl,lx+15,ly);lx+=ctx.measureText(col.lbl).width+28;});}
  }
  const a=document.createElement('a');a.download=`${nm.replace(/\s+/g,'_')}_plate.png`;a.href=canvas.toDataURL('image/png');a.click();
};

function rTabs(){
  let h='<div class="tabs-row">';
  S.plates.forEach(p=>{
    h+=`<div class="tab ${p.id===S.aid?'on':''}" onclick="switchPlate(${p.id})">`;
    h+=`<span ondblclick="event.stopPropagation();openRename(${p.id})">${p.name}</span>`;
    if(S.plates.length>1)h+=`<span class="tx" onclick="event.stopPropagation();delPlate(${p.id})">×</span>`;
    h+=`</div>`;
  });
  h+=`<button class="tadd" onclick="openNew()" title="Add plate">+</button>`;
  return h+'</div>';
}
function rToolbar(){
  let h='<div class="toolbar">';
  h+=`<button class="btn ${S.mode==='paint'?'on':''}" onclick="setMode('paint')">paint</button>`;
  h+=`<button class="btn ${S.mode==='select'?'on':''}" onclick="setMode('select')">select</button>`;
  h+='<div class="vsep"></div><div class="palette">';
  S.colors.forEach(c=>{
    const st=c.hex?`background:${c.hex};`:`background:var(--bg);border:2px dashed var(--border2)!important;`;
    h+=`<div class="ci"><div class="sw ${c.id===S.ac?'on':''}" style="${st}" onclick="setAC('${c.id}')" title="${c.lbl}"></div>`;
    if(S.editCid===c.id){
      h+=`<input class="clbl-in" id="ec-${c.id}" value="${c.lbl}" onblur="saveCLbl('${c.id}',this.value)" onkeydown="if(event.key==='Enter')saveCLbl('${c.id}',this.value);if(event.key==='Escape'){S.editCid=null;render();}"/>`;
    }else{
      h+=`<span class="clbl" onclick="editCLbl('${c.id}')" title="click to rename">${c.lbl}</span>`;
    }
    h+=`</div>`;
  });
  h+='</div><div class="vsep"></div>';
  h+=`<button class="btn" onclick="clearAll()">clear</button>`;
  h+=`<button class="btn" onclick="exportPNG()">export PNG</button>`;
  return h+'</div>';
}
function rWellGrid(){
  const plate=ap(),cfg=CFG[plate.type];
  const rows=cfg.rows.split(''),cols=cfg.cols,sz=cfg.sz,gap=3;
  let h=`<div class="wg" style="grid-template-columns:16px repeat(${cols},${sz}px);gap:${gap}px;align-items:center;">`;
  h+='<div></div>';
  for(let c=1;c<=cols;c++)h+=`<div class="cl2">${c}</div>`;
  rows.forEach(r=>{
    h+=`<div class="rl">${r}</div>`;
    for(let c=1;c<=cols;c++){
      const k=K(r,c),w=plate.wells[k]||{};
      const bg=w.col?w.col.hex:'var(--bg)',bc=w.col?w.col.hex:'var(--border2)';
      const tc2=w.col?TC(w.col.hex):'var(--text3)';
      const isel=S.sel.has(k);
      h+=`<div class="well${isel?' sel':''}" style="width:${sz}px;height:${sz}px;background:${bg};border-color:${bc};"
        onmousedown="onWD('${r}',${c})" onmouseenter="onWE('${r}',${c})"
        ondblclick="onWDbl('${r}',${c})" oncontextmenu="onWCtx(event,'${r}',${c})">`;
      if(w.lbl)h+=`<span class="wlbl" style="color:${tc2};font-size:${Math.max(7,sz/6)}px;">${w.lbl}</span>`;
      h+='</div>';
    }
  });
  return h+'</div>';
}
function rLane(){
  const plate=ap(),cfg=CFG[plate.type],slots=cfg.slots;
  const sw=38,sh=58,th=20,gap=4;
  const W=20+slots*(sw+gap)-gap+20;
  let h=`<svg width="${W}" height="${th+sh+36}" ondragstart="return false;" style="cursor:crosshair;">`;
  for(let i=1;i<=slots;i++){
    const x=20+(i-1)*(sw+gap),k=K('A',i),w=plate.wells[k]||{};
    const bg=w.col?w.col.hex:'var(--bg)',st=w.col?w.col.hex:'#888780';
    const tc2=w.col?TC(w.col.hex):'#888780',isel=S.sel.has(k);
    h+=`<g onmousedown="onWD('A',${i})" onmouseenter="onWE('A',${i})" ondblclick="onWDbl('A',${i})" oncontextmenu="onWCtx(event,'A',${i})" style="cursor:crosshair;">`;
    h+=`<rect x="${x}" y="8" width="${sw}" height="${th+2}" fill="${bg}" stroke="${st}" stroke-width="1.5" rx="2"/>`;
    h+=`<rect x="${x}" y="${th+8}" width="${sw}" height="${sh}" fill="${bg}" stroke="${st}" stroke-width="1.5" rx="2"/>`;
    if(isel)h+=`<rect x="${x-2}" y="6" width="${sw+4}" height="${th+sh+4}" fill="none" stroke="var(--text)" stroke-width="2" stroke-dasharray="4,3" rx="3"/>`;
    h+=`<text x="${x+sw/2}" y="${th+sh+24}" text-anchor="middle" font-size="10" font-family="monospace" fill="var(--text3)">${i}</text>`;
    if(w.lbl)h+=`<text x="${x+sw/2}" y="${th+sh/2+14}" text-anchor="middle" font-size="9" font-family="monospace" fill="${tc2}">${w.lbl.substring(0,6)}</text>`;
    h+='</g>';
  }
  h+=`<line x1="20" y1="8" x2="${W-20}" y2="8" stroke="#888780" stroke-width="1.5"/>`;
  return h+'</svg>';
}
function rSelBar(){
  if(!S.sel.size)return'';
  let h=`<div class="selbar"><span class="slbl">${S.sel.size} well${S.sel.size>1?'s':''} selected</span>`;
  h+='<div class="vsep"></div><span class="slbl">fill:</span>';
  S.colors.forEach(c=>{
    const st=c.hex?`background:${c.hex};`:`background:var(--bg);border:1.5px dashed var(--border2);`;
    h+=`<div class="msw" style="border:1.5px solid transparent;${st}" onclick="applySelColor('${c.id}')" title="${c.lbl}"></div>`;
  });
  h+='<div class="vsep"></div>';
  h+=`<button class="btn" onclick="openBL()">label all</button>`;
  h+=`<button class="btn" onclick="selectAll()">select all</button>`;
  h+=`<button class="btn" onclick="clearSel()">deselect</button>`;
  return h+'</div>';
}
function rLegend(){
  const plate=ap(),used=new Map();Object.values(plate.wells).forEach(w=>{if(w.col)used.set(w.col.id,w.col);});
  if(!used.size)return'';
  let h='<div class="legend"><span style="font-size:10px;color:var(--text3);">legend</span>';
  used.forEach(c=>{h+=`<div style="display:flex;align-items:center;gap:4px;"><div class="ldot" style="background:${c.hex};"></div><span>${c.lbl}</span></div>`;});
  return h+'</div>';
}
function rModalInner(){
  const{modal:m,mdata:d}=S;
  if(m==='label')return`<div class="modal" onclick="event.stopPropagation()"><h3>label ${d.r}${d.c}</h3><input id="mi" type="text" value="${d.val}" maxlength="12" placeholder="e.g. ctrl, 100nM, blank" oninput="S.mdata.val=this.value" onkeydown="if(event.key==='Enter')closeModal(true);if(event.key==='Escape')closeModal(false)"/><div class="mrow"><button class="btn" onclick="closeModal(false)">cancel</button><button class="btn on" onclick="closeModal(true)">save</button></div></div>`;
  if(m==='np')return`<div class="modal" onclick="event.stopPropagation()"><h3>new plate</h3><input id="mi" type="text" value="${d.name}" placeholder="plate name" oninput="S.mdata.name=this.value" onkeydown="if(event.key==='Enter')closeModal(true);if(event.key==='Escape')closeModal(false)"/><select onchange="S.mdata.type=this.value">${Object.entries(CFG).map(([k,v])=>`<option value="${k}" ${d.type===k?'selected':''}>${v.lbl}</option>`).join('')}</select><div class="mrow"><button class="btn" onclick="closeModal(false)">cancel</button><button class="btn on" onclick="closeModal(true)">create</button></div></div>`;
  if(m==='rp')return`<div class="modal" onclick="event.stopPropagation()"><h3>rename plate</h3><input id="mi" type="text" value="${d.val}" placeholder="plate name" oninput="S.mdata.val=this.value" onkeydown="if(event.key==='Enter')closeModal(true);if(event.key==='Escape')closeModal(false)"/><div class="mrow"><button class="btn" onclick="closeModal(false)">cancel</button><button class="btn on" onclick="closeModal(true)">save</button></div></div>`;
  if(m==='bl')return`<div class="modal" onclick="event.stopPropagation()"><h3>label ${S.sel.size} wells</h3><input id="mi" type="text" value="${d.val}" maxlength="12" placeholder="e.g. 100nM, treated" oninput="S.mdata.val=this.value" onkeydown="if(event.key==='Enter')closeModal(true);if(event.key==='Escape')closeModal(false)"/><p class="htxt">applies same label to all selected wells</p><div class="mrow"><button class="btn" onclick="closeModal(false)">cancel</button><button class="btn on" onclick="closeModal(true)">apply</button></div></div>`;
  return'';
}
function rModal(){
  if(!S.modal)return'';
  return`<div class="overlay" onclick="closeModal(false)">${rModalInner()}</div>`;
}
function render(){
  const plate=ap(),cfg=CFG[plate.type];
  let h=rTabs()+rToolbar();
  h+=`<div class="pzone">`;
  h+=cfg.t==='w'?rWellGrid():rLane();
  h+='</div>';
  if(S.mode==='select')h+=rSelBar();
  h+=rLegend();
  h+=`<div class="hint">${S.mode==='paint'?'click/drag = paint · double-click = label · right-click = erase':'drag = rectangle select · apply color or label below · double-click tab = rename plate'}</div>`;
  h+=rModal();
  document.getElementById('app').innerHTML=h;
  if(S.modal){setTimeout(()=>{const i=document.getElementById('mi');if(i)i.focus();},30);}
  if(S.editCid){const e=document.getElementById(`ec-${S.editCid}`);if(e){e.focus();e.select();}}
}
document.addEventListener('mouseup',()=>{S.mdown=false;});
render();
</script>
</body>
</html>
